# PocketBase 앞의 nginx.
#
#   1. <도메인>을 실제 도메인으로 바꾼다
#   2. /etc/nginx/sites-available/pocketbase 로 복사하고 sites-enabled에 링크
#   3. certbot --nginx -d <도메인> 으로 인증서를 받는다
#      (certbot이 아래 파일에 443 블록과 인증서 경로를 직접 써넣는다)
#
# 앱(정적 파일)은 여기서 서빙하지 않는 것을 권한다 — 가비아의 해외 무료
# 트래픽이 49GB뿐이라, 번들(gzip 630KB)을 여기서 내보내면 그것부터 닳는다.
# 정적 파일은 Cloudflare Pages 같은 무제한 CDN에 두고, 이 서버는 JSON API만
# 맡는 편이 낫다. 그 경우 아래 CORS 주석을 참고한다.

server {
    listen 80;
    listen [::]:80;
    server_name <도메인>;

    # 업로드 상한. 지금은 JSON만 오가서 훨씬 작지만, 나중에 글꼴·이미지
    # 파일까지 올리게 되면 이 값이 먼저 걸린다.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8090;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PocketBase의 실시간 구독(SSE)이 지나가는 길이다. 버퍼링을 켜두면
        # 이벤트가 묶여 있다가 한꺼번에 나오거나 아예 끊긴다.
        proxy_buffering off;
        proxy_read_timeout 360s;
    }
}

# ── CORS에 대하여 ─────────────────────────────────────────────
#
# 앱을 다른 주소(Cloudflare Pages 등)에 두면 브라우저가 교차 출처 요청을
# 막는다. 이건 nginx에서 헤더를 붙이는 것보다 **PocketBase 설정에서 푸는
# 편이 낫다** — 관리자 화면(Settings → Application)에 허용할 주소를 적으면
# 인증 쿠키·프리플라이트까지 알아서 맞춰준다.
#
# nginx에서 손으로 add_header를 붙이면 PocketBase가 이미 붙인 것과 겹쳐
# 헤더가 두 번 나가고, 그러면 브라우저가 오히려 전부 거부한다.
